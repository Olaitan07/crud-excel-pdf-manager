spring.application.name=excel-pdf-crud
server.port=8080
spring.datasource.url=jdbc:h2:mem:employee;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=Testing
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger UI — sort: POST → GET → PUT → PATCH → DELETE, then by path length within same method
springdoc.swagger-ui.operationsSorter=function(a,b){var o={'post':1,'get':2,'put':3,'patch':4,'delete':5};var ma=o[a.get('method')]||99,mb=o[b.get('method')]||99;if(ma!==mb)return ma-mb;return a.get('path').length-b.get('path').length;}
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true

